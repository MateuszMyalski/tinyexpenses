[package]
name = "tinyexpenses"
version = "0.2.0"
edition = "2024"

[dependencies]
askama = "0.15.1"
axum = "0.8.8"
axum-login = "0.18.0"
axum_csrf = { version = "0.11.0", features = ["layer"] }
chrono = { version = "0.4.42", features = ["serde"] }
csv = "1.4.0"
time = "0.3.30"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.49.0", features = ["full"] }
tower = "0.5.2"
tower-http = { version = "0.5", features = ["fs", "timeout", "trace"] }
tower-sessions = "0.14.0"
toml = "0.9.11"
scrypt = "0.11.0"
password-hash = "0.5.0"
axum-messages = "0.8.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
serde_json = "1.0.149"
base64 = "0.22"
hmac = "0.12.1"
sha2 = "0.10.9"
clap = { version = "4", features = ["derive"] }
